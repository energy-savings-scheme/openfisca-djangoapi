name: Deploy to UAT
on:
  workflow_dispatch:
  push:
    branches: [staging]
  repository_dispatch: # Triggered by a `push` event on a submodule
    types: [uat-openfisca-ruleset-updated] # repository_dispatch must have 'type' == "submodule-updated"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.SAFEGUARD_ESTIMATOR_INTEGRATIONS_AZURE_CREDS }}

      - name: Build Django
        run: |
          az vm run-command invoke -g ${{ secrets.AZURE_RESOURCE_GROUP_UAT }} -n ${{ secrets.AZURE_VM_NAME_UAT }} \
          --command-id RunShellScript \
          --scripts '
            set -e
            export HOME=/home/djangoApiAdmin
            cd $HOME/openfisca-djangoapi
            git config --global --add safe.directory $HOME/openfisca-djangoapi
            git fetch --all
            git reset --hard origin/staging
            docker compose up --build -d
            docker compose exec app bash entrypoint.sh setup_db
            docker compose exec app bash entrypoint.sh fetch_data
            docker compose exec app bash entrypoint.sh manage collectstatic --noinput
          '
